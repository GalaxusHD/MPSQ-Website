<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MPSQ Player</title>
  <style>
    html, body, #player, iframe { margin: 0; width: 100%; height: 100%; border: 0; background: #000; overflow: hidden; }
    #caption-shield { position: fixed; inset: 0; z-index: 2; background: #000; pointer-events: none; }
    #message { color: #fff; font: 16px sans-serif; display: grid; place-items: center; height: 100%; }
  </style>
</head>
<body>
  <div id="message">Video wird geladen …</div>
  <script>
    const parameters = new URLSearchParams(window.location.search);
    const videoId = parameters.get("v") || "";
    const start = Math.max(0, Number.parseInt(parameters.get("start") || "0", 10) || 0);
    const message = document.getElementById("message");

    if (!/^[A-Za-z0-9_-]{11}$/.test(videoId)) {
      message.textContent = "Ungültige YouTube-Video-ID.";
    } else {
      const origin = window.location.origin;
      message.remove();
      const playerElement = document.createElement("div");
      playerElement.id = "player";
      document.body.appendChild(playerElement);
      const captionShield = document.createElement("div");
      captionShield.id = "caption-shield";
      document.body.appendChild(captionShield);

      let captionCheckTimer = 0;
      let shieldFallbackTimer = 0;
      let captionsOffSince = 0;
      let shieldReleased = false;

      function releaseCaptionShield() {
        if (shieldReleased) return;
        shieldReleased = true;
        captionShield.remove();
        window.clearTimeout(captionCheckTimer);
        window.clearTimeout(shieldFallbackTimer);
      }

      function disableCaptions(player) {
        try {
          const modules = player.getOptions();
          if (Array.isArray(modules) && modules.includes("captions")) {
            player.unloadModule("captions");
          }
        } catch (_) {
          // The player may not have finished exposing its options yet.
        }
        try {
          // Also cover the case where YouTube has loaded the captions module
          // but getOptions() has not reported the module change yet.
          player.unloadModule("captions");
        } catch (_) {
          // Retried from onApiChange and while the player is starting.
        }
      }

      function checkCaptionsUntilOff(player) {
        disableCaptions(player);
        let loaded = true;
        try {
          loaded = player.getOptions().includes("captions");
        } catch (_) {
          // Keep the shield up until the IFrame API can confirm the state.
        }

        if (loaded) {
          captionsOffSince = 0;
        } else if (!captionsOffSince) {
          captionsOffSince = Date.now();
        }

        const stableOff = captionsOffSince && Date.now() - captionsOffSince >= 1000;
        if (!shieldReleased && !loaded && stableOff) {
          releaseCaptionShield();
          return;
        }
        if (!shieldReleased) {
          captionCheckTimer = window.setTimeout(() => checkCaptionsUntilOff(player), 100);
        }
      }

      window.onYouTubeIframeAPIReady = () => {
        new YT.Player("player", {
          videoId,
          playerVars: {
            autoplay: 1,
            controls: 1,
            playsinline: 1,
            enablejsapi: 1,
            cc_load_policy: 0,
            rel: 0,
            start,
            origin,
            widget_referrer: origin
          },
          events: {
            onReady(event) {
              event.target.unMute();
              event.target.setVolume(100);
              disableCaptions(event.target);
              event.target.playVideo();
              // Start caption verification as soon as the player is ready.
              // Waiting only for PLAYING can leave this full-screen black
              // shield in place forever in embedded MCEF browsers.
              checkCaptionsUntilOff(event.target);
              shieldFallbackTimer = window.setTimeout(releaseCaptionShield, 5000);
            },
            onApiChange(event) {
              // YouTube may add captions after onReady, for example after
              // restoring the viewer's remembered caption preference.
              disableCaptions(event.target);
              if (!shieldReleased) checkCaptionsUntilOff(event.target);
            },
            onStateChange(event) {
              if (event.data === YT.PlayerState.PLAYING) {
                captionsOffSince = 0;
                disableCaptions(event.target);
                window.clearTimeout(captionCheckTimer);
                checkCaptionsUntilOff(event.target);
              }
            }
          }
        });
      };

      const api = document.createElement("script");
      api.src = "https://www.youtube.com/iframe_api";
      document.head.appendChild(api);
    }
  </script>
</body>
</html>
