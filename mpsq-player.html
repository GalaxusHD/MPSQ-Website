<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MPSQ Player</title>
  <style>
    html, body, iframe { margin: 0; width: 100%; height: 100%; border: 0; background: #000; overflow: hidden; }
    #message { color: #fff; font: 16px sans-serif; display: grid; place-items: center; height: 100%; }
  </style>
</head>
<body>
  <div id="message">Video wird geladen …</div>
  <script>
    const parameters = new URLSearchParams(window.location.search);
    const videoId = parameters.get("v") || "";
    const start = Math.max(0, Number.parseInt(parameters.get("start") || "0", 10) || 0);
    const message = document.getElementById("message");

    if (!/^[A-Za-z0-9_-]{11}$/.test(videoId)) {
      message.textContent = "Ungültige YouTube-Video-ID.";
    } else {
      const frame = document.createElement("iframe");
      const origin = window.location.origin;
      frame.allow = "autoplay; encrypted-media; picture-in-picture";
      frame.allowFullscreen = true;
      frame.src = "https://www.youtube.com/embed/" + encodeURIComponent(videoId)
        + "?autoplay=1&mute=1&controls=1&playsinline=1&enablejsapi=1&cc_load_policy=0"
        + "&rel=0&start=" + start
        + "&origin=" + encodeURIComponent(origin)
        + "&widget_referrer=" + encodeURIComponent(origin);
      message.remove();
      document.body.appendChild(frame);
    }
  </script>
</body>
</html>
